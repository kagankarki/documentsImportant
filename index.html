<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Belge Hazinesi</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff;
    --text:#1d1d1f; --text2:#6e6e73;
    --sep:rgba(0,0,0,.10); --fill:rgba(0,0,0,.03); --fill-2:rgba(0,0,0,.05);
    --blue:#0071e3; --blue-2:#0077ed;
    --green:#34c759; --green-bg:rgba(52,199,89,.12);
    --red:#ff3b30; --red-bg:rgba(255,59,48,.12);
    --shadow:0 8px 30px rgba(0,0,0,.08);
    --radius:22px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --card:#1c1c1e;
      --text:#f5f5f7; --text2:#98989d;
      --sep:rgba(255,255,255,.14); --fill:rgba(255,255,255,.05); --fill-2:rgba(255,255,255,.09);
      --blue:#0a84ff; --blue-2:#409cff;
      --green:#30d158; --green-bg:rgba(48,209,88,.16);
      --red:#ff453a; --red-bg:rgba(255,69,58,.16);
      --shadow:0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e;
    --text:#f5f5f7; --text2:#98989d;
    --sep:rgba(255,255,255,.14); --fill:rgba(255,255,255,.05); --fill-2:rgba(255,255,255,.09);
    --blue:#0a84ff; --blue-2:#409cff;
    --green:#30d158; --green-bg:rgba(48,209,88,.16);
    --red:#ff453a; --red-bg:rgba(255,69,58,.16);
    --shadow:0 8px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;padding:56px 20px 72px;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background-color .55s ease,color .55s ease;
  }
  /* tema geçişini yumuşat (renkleri kullanan yüzeyler cross-fade olur) */
  .mark,.card,.glyph,.seg > i,.dl,.rewards{
    transition:background-color .55s ease,color .55s ease,border-color .55s ease,box-shadow .55s ease;
  }
  h1,.sub,.lead,.note,.qmeta,.qtext{transition:color .55s ease}
  .wrap{max-width:600px;margin:0 auto}

  header{text-align:center;margin-bottom:34px}
  .mark{
    width:56px;height:56px;margin:0 auto 20px;border-radius:16px;
    display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);
    color:var(--blue);
  }
  .mark svg{width:28px;height:28px}
  h1{
    font-size:clamp(30px,7vw,44px);font-weight:700;letter-spacing:-.022em;
    margin:0 0 10px;line-height:1.05;
  }
  .sub{
    color:var(--text2);margin:0 auto;max-width:460px;
    font-size:clamp(16px,4vw,19px);line-height:1.45;font-weight:400;letter-spacing:-.01em;
  }
  .sub .warn{color:var(--text);font-weight:600}

  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:34px 30px;
  }
  @media(max-width:460px){.card{padding:26px 20px}}

  /* segmented progress */
  .seg{display:flex;gap:6px;margin-bottom:26px}
  .seg > i{flex:1;height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden;position:relative}
  .seg > i::after{content:"";position:absolute;inset:0;width:0;background:var(--blue);
    border-radius:2px;transition:width .35s ease}
  .seg > i.done::after{width:100%}
  .seg > i.now::after{width:100%;background:var(--blue);opacity:.35}

  .qmeta{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em;
    text-transform:uppercase;margin-bottom:10px}
  .qtext{font-size:clamp(21px,5vw,26px);font-weight:600;letter-spacing:-.018em;
    line-height:1.28;margin:0 0 26px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    appearance:none;cursor:pointer;text-align:left;width:100%;
    background:var(--card);border:1px solid var(--sep);border-radius:14px;
    padding:17px 18px;font-size:17px;font-weight:500;color:var(--text);
    letter-spacing:-.01em;line-height:1.3;
    display:flex;align-items:center;gap:12px;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .opt:hover{background:var(--fill)}
  .opt:active{transform:scale(.99)}
  .opt .mk{width:22px;height:22px;flex:none;color:var(--text2);opacity:0;transition:opacity .18s}
  .opt .mk svg{width:22px;height:22px;display:block}
  .opt span.lbl{flex:1}
  .opt.correct{border-color:var(--green);background:var(--green-bg)}
  .opt.correct .mk{color:var(--green);opacity:1}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt.wrong .mk{color:var(--red);opacity:1}
  .opt.disabled{pointer-events:none}
  .opt.dim{opacity:.45}

  /* açık uçlu cevap */
  .answer-row{display:flex;gap:10px}
  .ans-input{
    flex:1;appearance:none;font-family:inherit;font-size:17px;color:var(--text);
    background:var(--card);border:1px solid var(--sep);border-radius:14px;
    padding:15px 16px;outline:none;letter-spacing:-.01em;transition:border-color .18s;
  }
  .ans-input:focus{border-color:var(--blue)}
  .ans-input:disabled{opacity:.6}
  .fb{min-height:22px;margin-top:12px;font-size:15px;font-weight:600}
  .fb-ok,.fb-bad{display:inline-flex;align-items:center;gap:6px}
  .fb-ok{color:var(--green)} .fb-bad{color:var(--red)}
  .fb svg{width:18px;height:18px}

  .btn{
    appearance:none;cursor:pointer;border:none;font-family:inherit;
    background:var(--blue);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;
    padding:14px 28px;border-radius:980px;transition:background .18s,transform .12s;
  }
  .btn:hover{background:var(--blue-2)}
  .btn:active{transform:scale(.97)}
  .btn.wide{width:100%}
  .btn.ghost{background:transparent;color:var(--blue)}
  .btn.ghost:hover{background:var(--fill)}

  /* tema seçici */
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px}
  .theme-opt{
    appearance:none;cursor:pointer;font-family:inherit;color:var(--text);
    background:var(--card);border:1px solid var(--sep);border-radius:18px;
    padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .theme-opt:hover{background:var(--fill);border-color:var(--blue)}
  .theme-opt:active{transform:scale(.98)}
  .theme-opt .ti{width:34px;height:34px;color:var(--blue)}
  .theme-opt .ti svg{width:34px;height:34px;display:block}
  .theme-opt .tn{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .theme-opt.light{background:#ffffff;color:#1d1d1f;border-color:rgba(0,0,0,.12)}
  .theme-opt.light .ti{color:#0071e3}
  .theme-opt.dark{background:#1c1c1e;color:#f5f5f7;border-color:rgba(255,255,255,.16)}
  .theme-opt.dark .ti{color:#0a84ff}

  .center{text-align:center}
  .glyph{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center}
  .glyph svg{width:44px;height:44px}
  .glyph.ok{background:var(--green-bg);color:var(--green)}
  .glyph.bad{background:var(--red-bg);color:var(--red)}
  .glyph.key{background:var(--fill-2);color:var(--blue)}
  .lead{font-size:clamp(24px,6vw,30px);font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
  .note{color:var(--text2);font-size:17px;line-height:1.5;margin:0 auto 28px;max-width:420px;letter-spacing:-.01em}
  .note b{color:var(--text);font-weight:600}

  /* reward list */
  .rewards{display:flex;flex-direction:column;margin:10px 0 8px;
    border:1px solid var(--sep);border-radius:16px;overflow:hidden}
  .dl{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    padding:15px 16px;transition:background .18s;border-top:1px solid var(--sep)}
  .dl:first-child{border-top:none}
  .dl:hover{background:var(--fill)}
  .dl .ic{width:30px;height:30px;flex:none;color:var(--text2)}
  .dl .ic svg{width:30px;height:30px;display:block}
  .dl .tx{flex:1;min-width:0}
  .dl .t{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .dl .d{color:var(--text2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .dl .go{display:flex;align-items:center;gap:5px;color:var(--blue);font-size:15px;font-weight:600;white-space:nowrap}
  .dl .go svg{width:17px;height:17px}

  .spin{width:44px;height:44px;margin:0 auto 20px;border-radius:50%;
    border:3px solid var(--fill-2);border-top-color:var(--blue);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .foot{text-align:center;color:var(--text2);font-size:14px;margin-top:26px;line-height:1.6;letter-spacing:-.01em}
  .foot b{color:var(--text);font-weight:600}

  .hidden{display:none}
  #cfx{position:fixed;inset:0;pointer-events:none;z-index:50}
  .fade{animation:fade .4s cubic-bezier(.22,.61,.36,1)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .nudge{animation:nudge .4s}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<canvas id="cfx"></canvas>
<div class="wrap">
  <header>
    <div class="mark" id="mark"></div>
    <h1>Belge Hazinesi</h1>
    <p class="sub">Belge şifreli. Tüm soruları doğru bilirsen belge senin. <span class="warn">Tek yanlışta baştan.</span></p>
  </header>

  <div class="card" id="stage"></div>

  <p class="foot">
    🔒 Belge, cevaplardan üretilen anahtarla <b>şifreli</b> olarak sitenin içinde.
    Yalnızca tüm soruları doğru bilince çözülüp iner.
  </p>
</div>

const SECURE = window.__SECURE__;
const CRYPTO_OK = !!(window.crypto && window.crypto.subtle && SECURE && SECURE.shares);

/* ---------- normalize (Türkçe-duyarlı, yerelden bağımsız — build ile birebir) ---------- */
function norm(s){
  return (s||"")
    .replace(/İ/g,"i").replace(/I/g,"i").replace(/ı/g,"i")
    .replace(/Ş/g,"s").replace(/ş/g,"s")
    .replace(/Ç/g,"c").replace(/ç/g,"c")
    .replace(/Ğ/g,"g").replace(/ğ/g,"g")
    .replace(/Ü/g,"u").replace(/ü/g,"u")
    .replace(/Ö/g,"o").replace(/ö/g,"o")
    .toLowerCase().replace(/[^a-z0-9]/g,"");
}
function b64u8(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

/* ---------- GF(256) Shamir birleştirme ---------- */
const EXP=new Uint8Array(256), LOG=new Uint8Array(256);
(function(){let a=1;for(let i=0;i<255;i++){EXP[i]=a;LOG[a]=i;
  let aa=a,bb=3,pp=0;
  for(let k=0;k<8;k++){if(bb&1)pp^=aa;const hi=aa&0x80;aa=(aa<<1)&0xff;if(hi)aa^=0x1b;bb>>=1;}
  a=pp;} EXP[255]=EXP[0];})();
const gmul=(a,b)=>(a===0||b===0)?0:EXP[(LOG[a]+LOG[b])%255];
const ginv=(a)=>EXP[(255-LOG[a])%255];
function gfcombine(points){
  const len=points[0].y.length, out=new Uint8Array(len);
  for(let bp=0;bp<len;bp++){let secret=0;
    for(let j=0;j<points.length;j++){let num=1,den=1;
      for(let m=0;m<points.length;m++){if(m===j)continue;
        num=gmul(num,points[m].x);den=gmul(den,points[j].x^points[m].x);}
      secret^=gmul(points[j].y[bp],gmul(num,ginv(den)));}
    out[bp]=secret;}
  return out;
}

/* ---------- WebCrypto ---------- */
async function deriveKey(passStr,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(passStr),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function aesDec(key,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));}

// açık uçlu cevaptan aday parçalar (bitişik kelime n-gramları -> "içerir" eşleşmesi)
function openCandidates(input){
  const words=(input||"").trim().split(/\s+/).filter(Boolean);
  const set=new Set();
  for(let i=0;i<words.length;i++)
    for(let j=i+1;j<=words.length;j++)
      set.add(words.slice(i,j).join(" "));
  if(input) set.add(input);
  return [...set];
}
// adaylardan biri, sorunun kabul cevaplarından biriyle parçayı çözerse doğru; yoksa null
async function verify(poolIndex, candidates){
  const sh=SECURE.shares[poolIndex];
  for(const cand of candidates){
    const nc=norm(cand); if(!nc) continue;
    for(const b of sh.w){
      try{
        const key=await deriveKey(nc, b64u8(b.salt), SECURE.kdfIter);
        const y=await aesDec(key, b64u8(b.iv), b64u8(b.ct));
        return {x:sh.x, y};
      }catch(e){}
    }
  }
  return null;
}
async function decryptDoc(points){
  const K=gfcombine(points);
  const key=await crypto.subtle.importKey("raw",K,{name:"AES-GCM"},false,["decrypt"]);
  return aesDec(key,b64u8(SECURE.file.iv),b64u8(SECURE.file.ct));
}

/* ---------- Durum ---------- */
const stage=document.getElementById("stage");
let idx=0, locked=false, game=[], collected=[], blobUrl=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Tema ---------- */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
function setTheme(t){ applyTheme(t); try{localStorage.setItem("theme",t)}catch(e){} }

function showTheme(){
  let committed=null; try{committed=localStorage.getItem("theme")}catch(e){}
  applyTheme(committed);
  stage.className="card fade";
  stage.innerHTML=`
    <div class="center">
      <p class="lead">Tema seç</p>
      <p class="note">Üzerine gelince önizle, seçmek için tıkla.</p>
    </div>
    <div class="themes">
      <button class="theme-opt light" data-theme-pick="light">
        <span class="ti">${I.sun}</span><span class="tn">Aydınlık</span></button>
      <button class="theme-opt dark" data-theme-pick="dark">
        <span class="ti">${I.moon}</span><span class="tn">Karanlık</span></button>
    </div>`;
  document.querySelectorAll("[data-theme-pick]").forEach(b=>{
    b.onmouseenter=()=>applyTheme(b.dataset.themePick);
    b.onmouseleave=()=>applyTheme(committed);
    b.onclick=()=>{committed=b.dataset.themePick;setTheme(committed);showStart();};
  });
}

/* ---------- Ekranlar ---------- */
function showStart(){
  idx=0;locked=false;game=[];collected=[];
  if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null;}
  stage.className="card fade";
  if(!CRYPTO_OK){
    stage.innerHTML=`
      <div class="center">
        <div class="glyph bad">${I.x}</div>
        <p class="lead">Açılamıyor</p>
        <p class="note">Şifreli belge yüklenemedi veya tarayıcı güvenli bağlam sağlamıyor.
          Dosyayı modern bir tarayıcıda (Chrome/Edge/Firefox) açmayı dene.</p>
      </div>`;
    return;
  }
  stage.innerHTML=`
    <div class="center">
      <div class="glyph key">${I.lock}</div>
      <p class="lead">Hazır mısın?</p>
      <p class="note">Sırayla <b>${POOL.length} sorunun</b> hepsini doğru bilmen gerekiyor.
        Bir tanesini yanlış yaparsan oyun biter ve <b>baştan başlarsın</b>.</p>
      <button class="btn" id="startBtn">Başla</button>
    </div>`;
  document.getElementById("startBtn").onclick=startGame;
}

function startGame(){
  game=shuffle([...Array(POOL.length).keys()]);   // tüm sorular, karışık sıra
  idx=0;locked=false;collected=[];
  renderQuestion();
}

function renderQuestion(){
  locked=false;
  const p=game[idx];
  const item=POOL[p];
  const seg=`<div class="seg">${game.map((_,i)=>`<i class="${i<idx?'done':i===idx?'now':''}"></i>`).join("")}</div>`;
  const meta=`<div class="qmeta">Soru ${idx+1} / ${game.length}</div><p class="qtext">${esc(item.q)}</p>`;
  stage.className="card fade";
  if(item.type==="open"){
    stage.innerHTML=`${seg}${meta}
      <div class="answer-row">
        <input type="text" id="ans" class="ans-input" placeholder="${esc(item.placeholder||"Cevabını yaz…")}" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn" id="okBtn">Cevapla</button>
      </div>
      <div class="fb" id="fb"></div>`;
    const inp=document.getElementById("ans");
    const submit=()=>submitOpen(p, inp.value);
    document.getElementById("okBtn").onclick=submit;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
    inp.focus();
  } else {
    const opts=shuffle(item.options);
    stage.innerHTML=`${seg}${meta}
      <div class="opts" id="opts">
        ${opts.map(o=>`<button class="opt" data-pool="${p}" data-val="${esc(o)}">
          <span class="lbl">${esc(o)}</span><span class="mk"></span></button>`).join("")}
      </div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickMC(b));
  }
}

function advance(){ setTimeout(()=>{idx++; idx>=game.length?finish():renderQuestion();},600); }

async function pickMC(btn){
  if(locked)return;locked=true;
  const all=[...document.querySelectorAll(".opt")];
  all.forEach(b=>b.classList.add("disabled"));
  const res=await verify(+btn.dataset.pool, [btn.dataset.val]);
  if(res){
    collected.push(res);
    btn.classList.add("correct");btn.querySelector(".mk").innerHTML=I.check;
    all.forEach(b=>{if(b!==btn)b.classList.add("dim")});
    advance();
  } else {
    btn.classList.add("wrong");btn.querySelector(".mk").innerHTML=I.x;
    document.getElementById("opts").classList.add("nudge");
    setTimeout(showGameOver,700);
  }
}

async function submitOpen(poolIndex, value){
  if(locked)return;
  if(!norm(value)){document.getElementById("ans").focus();return;}
  locked=true;
  document.getElementById("okBtn").disabled=true;
  document.getElementById("ans").disabled=true;
  const res=await verify(poolIndex, openCandidates(value));
  if(res){
    collected.push(res);
    document.getElementById("fb").innerHTML=`<span class="fb-ok">${I.check} Doğru</span>`;
    advance();
  } else {
    document.querySelector(".answer-row").classList.add("nudge");
    document.getElementById("fb").innerHTML=`<span class="fb-bad">${I.x} Yanlış</span>`;
    setTimeout(showGameOver,750);
  }
}

function showGameOver(){
  stage.className="card fade";
  stage.innerHTML=`
    <div class="center">
      <div class="glyph bad">${I.x}</div>
      <p class="lead">Oyun bitti</p>
      <p class="note">O soruyu yanlış bildin, hazine kapandı.${idx>0?` <b>${idx}. soruya kadar gelmiştin.</b>`:""}<br>İstediğin kadar tekrar deneyebilirsin.</p>
      <button class="btn" id="retry">Baştan Başla</button>
    </div>`;
  document.getElementById("retry").onclick=showStart;
}

async function finish(){
  stage.className="card fade";
  stage.innerHTML=`<div class="center"><div class="spin"></div>
    <p class="lead">Belge açılıyor…</p>
    <p class="note">Cevaplardan anahtar birleştiriliyor ve belge çözülüyor.</p></div>`;
  try{
    const bytes=await decryptDoc(collected);
    if(blobUrl)URL.revokeObjectURL(blobUrl);
    blobUrl=URL.createObjectURL(new Blob([bytes],{type:SECURE.mime||"application/octet-stream"}));
    showWin();
  }catch(e){
    stage.innerHTML=`<div class="center"><div class="glyph bad">${I.x}</div>
      <p class="lead">Bir sorun oldu</p>
      <p class="note">Belge çözülemedi. Lütfen tekrar dene.</p>
      <button class="btn" id="retry">Baştan Başla</button></div>`;
    document.getElementById("retry").onclick=showStart;
  }
}

function showWin(){
  stage.className="card fade";
  stage.innerHTML=`
    <div class="center">
      <div class="glyph ok">${I.check}</div>
      <p class="lead">Hepsini bildin</p>
      <p class="note">Belge çözüldü. Ödülün hazır — indir.</p>
    </div>
    <div class="rewards">
      <a class="dl" href="${blobUrl}" download="${esc(SECURE.fileName)}">
        <span class="ic">${I.sheet}</span>
        <span class="tx"><div class="t">Ders Raporu (Excel)</div><div class="d">${esc(SECURE.fileName)}</div></span>
        <span class="go">İndir ${I.down}</span>
      </a>
    </div>
    <div class="center" style="margin-top:22px">
      <button class="btn ghost" id="again">Tekrar Oyna</button>
    </div>`;
  document.getElementById("again").onclick=showStart;
  celebrate();
}

/* ---------- Konfeti ---------- */
const cv=document.getElementById("cfx"),cx=cv.getContext("2d");
let parts=[],raf=null;
const size=()=>{cv.width=innerWidth;cv.height=innerHeight};
size();addEventListener("resize",size);
function celebrate(){
  const colors=["#0071e3","#34c759","#ff9f0a","#ff3b30","#af52de","#5ac8fa"];
  for(let i=0;i<140;i++)parts.push({
    x:cv.width/2+(Math.random()-.5)*120,y:cv.height*.32,
    vx:(Math.random()-.5)*11,vy:Math.random()*-9-3,
    s:Math.random()*6+4,c:colors[i%colors.length],
    rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:150});
  run();
}
function run(){if(raf)return;const step=()=>{
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.99;p.rot+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    cx.globalAlpha=Math.max(0,Math.min(1,p.life/40));
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
  if(parts.length)raf=requestAnimationFrame(step);else{raf=null;cx.clearRect(0,0,cv.width,cv.height)}
};raf=requestAnimationFrame(step);}

showTheme();
</script>
